# This is a Declarative Automation Bundle definition for DAB_Practice_Project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DAB_Practice_Project
  uuid: 0c50883c-1d96-4d85-909b-5a286d165614

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616166193421.1.azuredatabricks.net
    variables:
      catalog: CL_Vivian
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405616166193421.1.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/fabric@vishnuarisdsgmail.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/fabric@vishnuarisdsgmail.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: CL_Vivian
      schema: prod
    permissions:
      - user_name: fabric@vishnuarisdsgmail.onmicrosoft.com
        level: CAN_MANAGE
